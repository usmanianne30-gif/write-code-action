services:
  - type: web
    name: write-code-action
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PASSWORD_UNIQUENESS_KEY
        generateValue: true
    disk:
      name: wca-member-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
